[package]
name = "apteva-app-sdk"
version = "0.1.0"
edition = "2021"
publish = false
description = "Experimental Rust implementation of Apteva's basic app HTTP/MCP contract"

[workspace]
members = ["examples/hello"]
resolver = "2"

[dependencies]
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }

[profile.dev]
debug = 0
incremental = false
